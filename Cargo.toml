[package]
name = "fray"
version = "0.2.1"
edition = "2021"
description = "Local, state-first coordination for coding agents"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
